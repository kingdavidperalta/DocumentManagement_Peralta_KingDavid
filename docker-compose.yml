services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
    container_name: documentmanagement-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    container_name: documentmanagement-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=DocumentManagementDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Storage__UploadPath: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads

volumes:
  sqlserver-data:
  uploads-data: